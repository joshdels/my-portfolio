name: my-portfolio

services:
  web:
    image: ${PORTFOLIO_IMAGE:-my-portfolio:latest}
    build:
      context: ..
      dockerfile: .docker/Dockerfile

    container_name: my-portfolio

    restart: unless-stopped

    init: true

    stop_grace_period: 35s

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      # Cold Wagtail boot takes ~10-15s; keep early probes from counting.
      start_period: 45s

    env_file:
      - ../.env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    tmpfs:
      # Shared by both Gunicorn workers, unlike per-process LocMemCache.
      - /tmp:size=128m,mode=1777

    ports:
      - "127.0.0.1:8007:8000"

    networks:
      - gis_centralize_db

networks:
  gis_centralize_db:
    external: true
    name: gis_centralize_db
