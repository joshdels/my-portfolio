name: my-portfolio

services:
  web:
    image: ${PORTFOLIO_IMAGE:-my-portfolio:latest}
    build:
      context: ..
      dockerfile: .docker/Dockerfile

    container_name: my-portfolio

    restart: unless-stopped

    init: true

    stop_grace_period: 35s

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}); response = urllib.request.urlopen(request, timeout=8); raise SystemExit(0 if response.read() == b'ok' else 1)"]
      interval: 15s
      # Starting the Python probe can itself be slow on the shared VPS. Keep
      # Docker's deadline above the request timeout so failures stay diagnostic.
      timeout: 15s
      retries: 8
      start_period: 60s

    env_file:
      - ../.env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    tmpfs:
      # Shared by both Gunicorn workers, unlike per-process LocMemCache.
      - /tmp:size=128m,mode=1777

    ports:
      - "127.0.0.1:8007:8000"

    networks:
      - gis_centralize_db

networks:
  gis_centralize_db:
    external: true
    name: gis_centralize_db
