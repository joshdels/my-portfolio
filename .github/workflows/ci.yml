name: CI/CD My Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-cicd-${{ github.ref }}
  # Stale pull-request checks are disposable. A production rollout is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set immutable image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        run: |
          bash -n .docker/deploy.sh
          cp .env.example .env
          PORTFOLIO_IMAGE=my-portfolio:validation \
            docker compose -f .docker/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=portfolio-production
          cache-to: type=gha,mode=max,scope=portfolio-production

      - name: Run Django tests in the production image
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            ${{ steps.image.outputs.name }}:${{ github.sha }} \
            python manage.py test apps.porfolio apps.services --settings=config.settings.test

      - name: Run Django system checks in the production image
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            ${{ steps.image.outputs.name }}:${{ github.sha }} \
            python manage.py check --settings=config.settings.test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"

  deploy:
    name: Deploy tested image to Vultr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PORTFOLIO_IMAGE: ${{ needs.build-and-test.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 25m
          envs: DEPLOY_SHA,PORTFOLIO_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -Eeuo pipefail
            cd ~/myapps/my-portfolio
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            bash .docker/deploy.sh
