name: CI/CD My Portfolio

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Native run with a cached uv is far faster than building a Docker
      # image just to run the SQLite-backed test settings.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django tests
        run: uv run python manage.py test apps.porfolio apps.services --settings=config.settings.test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: test

    # Only build/deploy artifacts for pushes to main; PRs stop at tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          tags: my-portfolio:latest
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          timeout: 30m
          command_timeout: 30m

          script: |
            set -e

            echo "--- Entering project directory ---"
            cd ~/myapps/my-portfolio

            echo "--- Updating Repository ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Building and Starting Containers ---"
            export DOCKER_BUILDKIT=1

            docker-compose \
              -f .docker/docker-compose.yml \
              up -d \
              --build

            echo "--- Cleaning Up Old Docker Images ---"
            docker image prune -f

            echo "--- My Portfolio Deployment Complete ---"
