[project]
name = "my-porfolio"
version = "0.1.0"
description = "Joshdels freelance CAD-to-GIS, parcel mapping, and masterplan WebGIS portfolio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.96",
    "django>=6.1.1",
    "django-storages>=1.14.6",
    "dotenv>=0.9.9",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "wagtail>=8.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "djlint>=1.46.1",
]
